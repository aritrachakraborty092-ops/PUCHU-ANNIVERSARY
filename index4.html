<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Under The Same Sky 🌙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia,"Noto Serif Bengali",serif;
    color:white;

    background:
        radial-gradient(circle at 50% 15%,#30265f 0%,transparent 35%),
        linear-gradient(
            180deg,
            #050313 0%,
            #0b0825 45%,
            #17091f 75%,
            #260b20 100%
        );
}

/* =========================
   SKY
========================= */

.sky{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Stars */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 8px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}

/* Bigger stars */

.big-star{
    width:5px;
    height:5px;
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;

    width:180px;
    height:180px;

    right:12%;
    top:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #fffef1,
            #fff6c7 55%,
            #e8dca5 100%
        );

    box-shadow:
        0 0 30px #fff6c4,
        0 0 80px #fff3b355,
        0 0 150px #fff2a922;
}

/* Moon craters */

.crater{
    position:absolute;
    background:#dfd39d;
    border-radius:50%;
    opacity:.35;
}

.c1{
    width:30px;
    height:30px;
    left:35px;
    top:45px;
}

.c2{
    width:18px;
    height:18px;
    right:40px;
    top:65px;
}

.c3{
    width:25px;
    height:25px;
    left:75px;
    bottom:35px;
}

/* =========================
   SHOOTING STAR
========================= */

.shooting{
    position:absolute;

    width:120px;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white
        );

    transform:rotate(-35deg);

    animation:shoot 6s linear infinite;

    opacity:0;
}

@keyframes shoot{

    0%{
        left:-150px;
        top:15%;
        opacity:0;
    }

    5%{
        opacity:1;
    }

    15%{
        left:110%;
        top:45%;
        opacity:0;
    }

    100%{
        left:110%;
        top:45%;
        opacity:0;
    }
}

.shooting.two{
    animation-delay:3s;
    animation-duration:7s;
}

/* =========================
   CONTENT
========================= */

.container{
    position:relative;
    z-index:5;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
    text-align:center;
}

.content{
    width:min(850px,95%);
}

/* Small title */

.small{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:5px;
    color:#d9cfff;
    text-transform:uppercase;
}

/* Main title */

h1{
    font-size:clamp(45px,9vw,90px);
    margin:15px 0;

    color:#fff;

    text-shadow:
        0 0 15px #fff,
        0 0 35px #caa9ff,
        0 0 70px #8f6fff;
}

.subtitle{
    color:#dcd5f4;
    font-size:18px;
    line-height:1.8;

    max-width:650px;

    margin:0 auto 30px;
}

/* =========================
   GLASS MESSAGE
========================= */

.message-box{

    width:min(720px,100%);

    margin:auto;

    padding:35px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(12px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.15);
}

.message-box h2{
    font-size:30px;
    margin-bottom:18px;
    color:#ffe8f1;
}

.message{
    min-height:150px;

    font-size:20px;
    line-height:2;

    color:#f5eefa;
}

/* Cursor */

.cursor{
    display:inline-block;

    width:2px;
    height:22px;

    background:#fff;

    margin-left:3px;

    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

/* =========================
   BUTTON
========================= */

.btn{

    margin-top:25px;

    padding:13px 28px;

    border:none;
    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #c35c8b,
            #784fa4
        );

    color:white;

    font-size:15px;

    cursor:pointer;

    box-shadow:
        0 10px 30px #8d5aa655;

    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px #a66bc477;
}

/* =========================
   FLOATING HEARTS
========================= */

.heart{
    position:absolute;

    bottom:-50px;

    font-size:20px;

    opacity:0;

    animation:heartFloat 8s linear infinite;
}

@keyframes heartFloat{

    0%{
        transform:translateY(0) scale(.7);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    100%{
        transform:
            translateY(-110vh)
            scale(1.2)
            rotate(30deg);

        opacity:0;
    }
}

/* =========================
   FINAL MESSAGE
========================= */

.final{
    margin-top:25px;

    font-size:18px;

    color:#ffe1ec;

    opacity:0;

    transform:translateY(15px);

    transition:1s;
}

.final.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .moon{
        width:110px;
        height:110px;

        right:8%;
        top:8%;
    }

    .message-box{
        padding:25px 18px;
    }

    .message{
        font-size:17px;
        line-height:1.9;
    }

    .message-box h2{
        font-size:25px;
    }

    .subtitle{
        font-size:16px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<!-- =========================
     SKY
========================= -->

<div class="sky" id="sky">

    <div class="moon">

        <div class="crater c1"></div>
        <div class="crater c2"></div>
        <div class="crater c3"></div>

    </div>

    <div class="shooting"></div>
    <div class="shooting two"></div>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">

<div class="content">

    <div class="small">
        Under The Same Sky
    </div>

    <h1>Moupriya 🌙</h1>

    <p class="subtitle">
        পৃথিবীর যেখানেই থাকো না কেন,
        আজ রাতের আকাশের দিকে তাকালে মনে রেখো—
        এই একই আকাশের নিচে আমিও তোমাকে ভাবছি। ❤️
    </p>


    <div class="message-box">

        <h2>একটা কথা তোমাকে বলি... 💌</h2>

        <div class="message" id="message"></div>

        <button class="btn" id="replay">
            আবার শুনবে? ❤️
        </button>

        <div class="final" id="final">
            দূরত্ব আমাদের মাঝে হতে পারে,
            কিন্তু আমার হৃদয়ে তোমার জায়গাটা সবসময় তোমারই থাকবে। ♾️❤️
        </div>

    </div>

</div>

</div>


<script>

/* =========================
   CREATE STARS
========================= */

const sky=document.getElementById("sky");

for(let i=0;i<130;i++){

    const star=document.createElement("div");

    star.className="star";

    if(Math.random()>.88){
        star.classList.add("big-star");
    }

    star.style.left=
        Math.random()*100+"%";

    star.style.top=
        Math.random()*100+"%";

    star.style.animationDelay=
        Math.random()*3+"s";

    star.style.animationDuration=
        (1.5+Math.random()*2.5)+"s";

    sky.appendChild(star);
}


/* =========================
   FLOATING HEARTS
========================= */

for(let i=0;i<18;i++){

    const heart=document.createElement("div");

    heart.className="heart";

    heart.textContent=
        ["♡","♥","❤","💕","💗"][Math.floor(Math.random()*5)];

    heart.style.left=
        Math.random()*100+"%";

    heart.style.fontSize=
        (14+Math.random()*22)+"px";

    heart.style.animationDuration=
        (6+Math.random()*7)+"s";

    heart.style.animationDelay=
        Math.random()*8+"s";

    sky.appendChild(heart);
}


/* =========================
   TYPEWRITER
========================= */

const message=document.getElementById("message");

const final=document.getElementById("final");

const replay=document.getElementById("replay");

const text=
`Moupriya...

জানো, রাতের আকাশের দিকে তাকালে
কখনো কখনো মনে হয়,
এত বড় পৃথিবীতে একজন মানুষ
কীভাবে আরেকজন মানুষের কাছে
এতটা গুরুত্বপূর্ণ হয়ে যেতে পারে।

তুমি আমার কাছে ঠিক তেমনই একজন।

হয়তো এই মুহূর্তে তুমি আমার পাশে নেই,
হয়তো তোমাকে ছুঁতে পারছি না,
কিন্তু আমার প্রতিদিনের চিন্তার মধ্যে
তুমি ঠিকই আছো।

তুমি আমার সেই মানুষ,
যার সাথে কথা বলার পর
মনটা একটু শান্ত হয়ে যায়।

আর যদি কোনোদিন তোমার মনে হয়
তুমি একা,
তাহলে শুধু আকাশটার দিকে তাকিয়ো...

মনে রেখো,
এই একই আকাশের নিচে
কেউ একজন তোমাকে খুব ভালোবাসে। ❤️`;

let index=0;
let timer=null;


/* =========================
   TYPE EFFECT
========================= */

function typeText(){

    clearInterval(timer);

    index=0;

    message.innerHTML="";

    final.classList.remove("show");

    timer=setInterval(()=>{

        if(index<text.length){

            const char=text[index];

            if(char==="\n"){

                message.innerHTML+="<br>";

            }else{

                message.innerHTML+=char;

            }

            index++;

        }else{

            clearInterval(timer);

            setTimeout(()=>{
                final.classList.add("show");
            },700);

        }

    },35);

}


/* Start */

typeText();


/* Replay */

replay.addEventListener("click",()=>{

    typeText();

});


</script>

</body>
</html>
